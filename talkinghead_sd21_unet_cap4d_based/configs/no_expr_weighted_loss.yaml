# =============================================================================
# No FLAME Conditioning + Expression-Weighted Loss
#
# UNet conditioning:  1 channel (ref mask only — no face geometry or deformation)
# Loss weighting:     Expression-weighted (alpha=5.0)
# Audio:              wav2vec2 cross-attention
# Reference frame:    Identity passthrough via z_input
#
# The UNet sees NO FLAME spatial conditioning, but the diffusion loss is still
# weighted by expression deformation magnitude. The full expression map is
# computed internally for loss weighting only — the UNet never sees it.
# Tests whether guiding the denoiser to focus on face-active regions via loss
# weighting can partially compensate for the absence of explicit conditioning.
# =============================================================================

output_dir: "outputs/no_expr_weighted_loss"

learning_rate:     1.0e-4
gpu_batch_size:    4
virtual_batch_size: 4
logger_freq:       50
n_steps:           200000
save_every_n_steps: 250

init_path: "models/v2-1_512-ema-pruned.ckpt"

# ---------------------------------------------------------------------------
# Dataset (identical to full model)
# ---------------------------------------------------------------------------
train_dataset:
  target: talkinghead_sd21_unet_cap4d_based.data.video_dataset.TalkingHeadDataset
  params:
    id_list_path: "talkinghead_sd21_unet_cap4d_based/data/train_ids.txt"
    video_root:   "data/talkvid/talkvid"
    audio_root:   "data/talkvid/audio"
    flame_root:   "data/flowface"
    n_frames: 16
    resolution: 512
    downsample_ratio: 8
    fps: 25.0
    audio_context_frames: 2
    use_ray_directions: false
    add_mouth: true
    stabilize_background: false # trick did not work as per expected
    feather_radius: 5

val_dataset:
  target: talkinghead_sd21_unet_cap4d_based.data.video_dataset.TalkingHeadDataset
  params:
    id_list_path: "talkinghead_sd21_unet_cap4d_based/data/val_ids.txt"
    video_root:   "/data/pouyan/talkvid/preprocessed/talkvid"
    audio_root:   "/data/pouyan/talkvid/preprocessed/audio"
    flame_root:   "/data/pouyan/flame_expression/flowface"
    n_frames: 16
    resolution: 512
    downsample_ratio: 8
    fps: 25.0
    audio_context_frames: 2
    use_ray_directions: false
    add_mouth: true
    stabilize_background: false
    feather_radius: 5

# Validation & visualization
val_every_n_steps:    250
n_val_batches:        20
n_vis_samples:        8
vis_ddim_steps:       20

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  target: talkinghead_sd21_unet_cap4d_based.model.th_diffusion.THDiffusion
  params:
    first_stage_key:  "jpg"
    control_key:      "hint"
    audio_key:        "audio"

    n_frames:         16
    cfg_probability:  0.1

    # Loss weighting: expression map is absent from UNet conditioning but still
    # used to weight the loss on high-deformation face regions
    expr_weight_alpha: 5.0

    # Noise schedule
    linear_start:     0.00085
    linear_end:       0.0120
    timesteps:        1000
    zero_snr_shift:   true
    shift_schedule_flag: true
    sqrt_shift:       true
    minus_one_shift:  true

    # LDM base settings
    num_timesteps_cond: 1
    log_every_t:      200
    image_size:       64
    channels:         4
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor:          val/loss_simple_ema
    scale_factor:     0.18215
    use_ema:          false
    only_mid_control: false
    parameterization: eps

    # ---- Audio encoder (unchanged) ----
    audio_encoder_config:
      target: talkinghead_sd21_unet_cap4d_based.model.audio_encoder.AudioEncoder
      params:
        model_name:      "facebook/wav2vec2-base-960h"
        context_dim:     1024
        freeze_backbone: true
        use_pretrained:  true

    # ---- UNet ----
    unet_config:
      target: talkinghead_sd21_unet_cap4d_based.model.th_unet.THUnetModel
      params:
        image_size:           64
        time_steps:           16
        temporal_mode:        "3d"
        in_channels:          4
        out_channels:         4
        model_channels:       320
        condition_channels:   1       # only ref_mask (was 46)
        context_dim:          1024
        attention_resolutions: [4, 2, 1]
        num_res_blocks:       2
        channel_mult:         [1, 2, 4, 4]
        num_head_channels:    64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth:    1
        use_checkpoint:       false
        legacy:               false

    # ---- VAE (frozen, identical) ----
    first_stage_config:
      target: controlnet.ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 512
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    # ---- Conditioning module ----
    cond_stage_config:
      target: talkinghead_sd21_unet_cap4d_based.conditioning.th_conditioning.THConditioning
      params:
        image_size:           64
        positional_channels:  42
        positional_multiplier: 1.0
        super_resolution:     2
        use_ray_directions:   false
        use_expr_deformation: true
        use_crop_mask:        false
        drop_expression_map:  true    # removes all FLAME spatial conditioning

# ---------------------------------------------------------------------------
# Inference defaults
# ---------------------------------------------------------------------------
inference:
  n_ddim_steps:  50
  cfg_scale:     2.0
  eta:           0.0
  n_frames:      16
  seed:          42
