# =============================================================================
# Stage 1: Spatial Marigold Training (single-frame, T=1)
#
# Trains the DiT with T=1 on (natural face frame → deformation map frame)
# pairs. Temporal attention is a no-op at T=1, so the model learns purely
# spatial mapping. ~900k image pairs from ~7150 clips x ~127 frames.
# =============================================================================

# ---- Model ----
model_id: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"

# ---- Data ----
manifest_path: "data/derived/manifest.json"
flame_root: "data/flowface"
resolution: 512
min_frames: 10
prompt_latent_cache_dir: "data/derived/prompt_latent_cache"

# ---- Training ----
batch_size: 128                                      # T=1 is cheap — use large batches
gradient_accumulation: 1
gradient_checkpointing: true
lr: 3.5e-5
weight_decay: 0.01
warmup_steps: 100
decay_iters: 50000
lr_min_ratio: 0.01
max_steps: 50000
grad_clip: 1.0

# ---- CFG ----
cfg_dropout: 0.1

# ---- Logging ----
output_dir: "outputs/marigold_spatial"
log_every: 1
save_every: 1000

# ---- Precision ----
mixed_precision: "bf16"

# ---- Reproducibility ----
seed: 42
gpu: 0
