# =============================================================================
# Marigold Training with SD3.5 Medium: face frame → deformation map
#
# SD3Transformer2DModel (24-layer MMDiT, ~1.5B params) with rectified flow.
# Input layer doubled from 16 to 32 channels (Marigold-style conditioning).
# Full fine-tuning of all transformer parameters.
# =============================================================================

# ---- Model ----
model_id: "stabilityai/stable-diffusion-3.5-medium"

# ---- Data ----
manifest_path: "data/derived/manifest.json"
flame_root: "data/flowface"
resolution: 512
min_frames: 10

# ---- Training ----
batch_size: 32
gradient_accumulation: 1
gradient_checkpointing: true
lr: 3.5e-5
weight_decay: 0.01
warmup_steps: 100
decay_iters: 50000
lr_min_ratio: 0.01
max_steps: 50000
grad_clip: 1.0

# ---- Eval ----
num_eval_samples: 8

# ---- Logging ----
output_dir: "outputs/marigold_spatial"
log_every: 1
save_every: 1000
eval_every: 250

# ---- Precision ----
mixed_precision: "bf16"

# ---- Reproducibility ----
seed: 42
gpu: 0
