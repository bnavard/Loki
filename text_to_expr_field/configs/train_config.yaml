# =============================================================================
# Text-to-Expression-Field Training Configuration
#
# Fine-tunes Wan2.2-T2V-A14B DiT with LoRA to generate 45-channel
# FLAME expression dense fields from text captions.
# =============================================================================

# ---- Model ----
model_id: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"

# ---- LoRA ----
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.05

# ---- Data ----
manifest_path: "data/derived/manifest.json"
flame_root: "data/flowface"
resolution: 512                                    # expression field spatial resolution
target_frames: 80                                 # frames per clip (first 80 used)
vae_latent_cache_dir: "data/derived/vae_latent_cache"    # precomputed VAE latents (from cache_vae_latents.py)
prompt_latent_cache_dir: "data/derived/prompt_latent_cache"      # precomputed UMT5 text embeddings (from cache_text_embeddings.py)
cached_only: true                                    # only train on clips with cached latents (no on-the-fly VAE)

# ---- Training ----
batch_size: 1            # per GPU — 14B + long latent sequences are memory-heavy
gradient_accumulation: 1  # effective batch size = batch_size × num_gpus × gradient_accumulation
gradient_checkpointing: true  # recompute activations in backward (~30% slower, saves ~40% memory)
group_offload: true           # move inactive transformer blocks to CPU, prefetch via CUDA streams
use_8bit_adam: true           # halve optimizer state memory via bitsandbytes
lr: 1.0e-5
weight_decay: 0.01
warmup_steps: 500
max_steps: 20000
grad_clip: 1.0

# ---- CFG ----
cfg_dropout: 0.1         # drop text conditioning 10% of the time

# ---- Logging ----
output_dir: "outputs/text_to_expr_field"
log_every: 50
save_every: 2000

# ---- Precision ----
mixed_precision: "bf16"

# ---- Workers ----
num_workers: 2
gpu: 0                   # single-GPU fallback (ignored when using accelerate)
