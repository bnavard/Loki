# =============================================================================
# Text-to-Expression-Field Training — Wan2.2-T2V-A14B (14B DiT)
#
# LoRA fine-tuning with flow matching loss. Both VAE latents and text
# embeddings are loaded from precomputed caches (no VAE or text encoder
# loaded during training). Random temporal slicing of cached latents
# provides data augmentation across epochs.
# =============================================================================

# ---- Model ----
model_id: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"

# ---- LoRA ----
lora_rank: 64
lora_alpha: 64
lora_dropout: 0.05

# ---- Data ----
manifest_path: "data/derived/manifest.json"
flame_root: "data/flowface"
resolution: 512                                    # expression field spatial resolution
target_frames: 80                                 # frames per clip (first 80 used for VAE caching)
target_real_frames: 24                             # frames per training window (must be divisible by 4)
                                                    # → latent T = 15*24/4 + 1 = 91 (~93k tokens)
                                                    # Valid options: 16→T=61, 20→T=76, 24→T=91, 28→T=106, 32→T=121
vae_latent_cache_dir: "data/derived/vae_latent_cache_80_frame_full_exp_map"    # precomputed VAE latents (from cache_vae_latents.py)
prompt_latent_cache_dir: "data/derived/prompt_latent_cache"      # precomputed UMT5 text embeddings (from cache_text_embeddings.py)
cached_only: true                                    # only train on clips with cached latents (no on-the-fly VAE)

# ---- Training ----
batch_size: 1            # per GPU — 14B + long latent sequences are memory-heavy
gradient_accumulation: 4  # effective batch size = batch_size × num_gpus × gradient_accumulation
gradient_checkpointing: true  # recompute activations in backward (~30% slower, saves ~40% memory)
group_offload: false          # incompatible with gradient checkpointing (params on CPU during recompute)
lr: 1.0e-5
weight_decay: 0.01
max_steps: 20000
grad_clip: 1.0

# ---- CFG ----
cfg_dropout: 0.1         # drop text conditioning 10% of the time

# ---- Logging ----
output_dir: "outputs/text_to_expr_field"
log_every: 1
save_every: 2000

# ---- Precision ----
mixed_precision: "bf16"

# ---- Workers ----
num_workers: 2
gpu: 0                   # single-GPU fallback (ignored when using accelerate)
