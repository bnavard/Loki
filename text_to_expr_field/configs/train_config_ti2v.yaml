# =============================================================================
# Text+Image to Expression Field — Wan2.2-TI2V-5B
#
# Uses the smaller 5B single-transformer model (not MoE) conditioned on both
# text captions and a reference face image from the training clip.
# Significantly less memory than the 14B A14B model.
# =============================================================================

# ---- Model ----
model_id: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"

# ---- LoRA (smaller rank for 5B model) ----
lora_rank: 64
lora_alpha: 64
lora_dropout: 0.05

# ---- Data ----
manifest_path: "data/derived/manifest.json"
flame_root: "data/flowface"
resolution: 512
target_frames: 80
latent_cache_dir: "data/derived/vae_latent_cache"
text_cache_dir: "data/derived/text_embed_cache"
cached_only: true

# ---- Training ----
batch_size: 1
gradient_accumulation: 4
lr: 2.0e-5
weight_decay: 0.01
warmup_steps: 500
max_steps: 20000
grad_clip: 1.0

# ---- CFG ----
cfg_dropout: 0.1

# ---- Logging ----
output_dir: "outputs/text_to_expr_field_ti2v"
log_every: 50
save_every: 2000

# ---- Precision ----
mixed_precision: "bf16"

# ---- Workers ----
num_workers: 2
gpu: 0
