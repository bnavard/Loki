# =============================================================================
# Marigold-Style Training: Natural Video → Deformation Map Video
#
# Adapts the Marigold depth estimation approach to video. The DiT's input
# layer is doubled from 16 to 32 channels to accept concatenated
# [noisy_target_deform_latent, clean_natural_video_latent].
#
# The natural video provides spatiotemporal anchoring — the model learns
# to generate the deformation map that corresponds to the given video,
# rather than generating from scratch.
#
# Full fine-tuning (not LoRA) of the 1.3B transformer.
# =============================================================================

# ---- Model ----
model_id: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"

# ---- Data ----
manifest_path: "data/derived/manifest.json"
flame_root: "data/flowface"
video_root: "data/talkvid/talkvid"
resolution: 512
target_frames: 81                                  # 4k+1 = 4x20+1
prompt_latent_cache_dir: "data/derived/prompt_latent_cache"

# ---- Training ----
batch_size: 8
gradient_accumulation: 4
gradient_checkpointing: true
lr: 5.0e-6                                        # initial LR for full fine-tuning
weight_decay: 0.01
warmup_steps: 100                                  # linear warmup
decay_iters: 25000                                 # exponential decay horizon
lr_min_ratio: 0.01                                 # decay to 1% of initial LR
max_steps: 5000
grad_clip: 1.0

# ---- CFG ----
cfg_dropout: 0.1

# ---- Logging ----
output_dir: "outputs/marigold_deform"
log_every: 1
save_every: 500

# ---- Precision ----
mixed_precision: "bf16"

# ---- Reproducibility ----
seed: 42
gpu: 0
