# =============================================================================
# Text-to-Deformation-Map Training — Wan2.2-T2V-A14B (14B DiT)
#
# Trains on the 3-channel deformation map only (FLAME vertex offsets,
# channels 42-44 of the full 45ch expression field). No channel reshaping
# needed since the deformation map is already 3ch RGB-compatible.
#
# Cached latent shape: [16, 21, 64, 64]
#   - 84 original frames of 3ch deform → truncated to 81 (4k+1) → VAE → T=21
#   - 16 VAE latent channels, 64×64 spatial (512/8)
#
# Uses target_latent_T to directly set the temporal window size, bypassing
# the 45→15×3 reshaping formula that the full expression field uses.
# =============================================================================

# ---- Model ----
model_id: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"

# ---- LoRA ----
lora_rank: 128
lora_alpha: 128
lora_dropout: 0.05

# ---- Data ----
manifest_path: "data/derived/manifest.json"
flame_root: "data/flowface"
resolution: 512
target_frames: 84                                  # original deform video frame count
target_real_frames: 84                             # use full clip (no sub-windowing needed)
target_latent_T: 21                                # direct override: full cached latent T dimension
vae_latent_cache_dir: "data/derived/vae_latent_cache_deform"
prompt_latent_cache_dir: "data/derived/prompt_latent_cache"
cached_only: true

# ---- Training ----
batch_size: 4
gradient_accumulation: 4
gradient_checkpointing: true
group_offload: false
lr: 1.0e-5
weight_decay: 0.01
warmup_steps: 500
max_steps: 20000
grad_clip: 1.0

# ---- CFG ----
cfg_dropout: 0.1

# ---- Logging ----
output_dir: "outputs/text_to_deform_field"
log_every: 1
save_every: 250

# ---- Precision ----
mixed_precision: "bf16"

# ---- Workers ----
num_workers: 2
gpu: 0
