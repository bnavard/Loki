# Audio ablation — "audio off" arm.
#
# Identical to marionette_baseline in every respect except:
#   - audio cross-attention disabled via the audio/off overlay
#     (audio_encoder_config: null, use_audio_context: false)
#   - output_dir routes under outputs/ablate_audio/
#
# The audio-on counterpart is the existing `marionette_baseline` run. Because
# both inherit from `marionette/configs/base.yaml` and keep `seed: 42`,
# `n_steps`, `gpu_batch_size`, `virtual_batch_size`, and the SD 2.1 init path
# unchanged — and because train.py calls `pl.seed_everything(cfg.seed,
# workers=True)` + sets `deterministic=True` + `torch.backends.cudnn.enabled
# = False` — the two arms walk the same data in the same order and start from
# the same pretrained weights. The audio cross-attention pathway is the sole
# independent variable.

base: marionette/configs/base.yaml

overlays:
  - marionette/configs/overlays/audio/off.yaml

output_dir: outputs/ablate_audio/audio_off
