# Condition ablation — "no deformation" arm.
#
# Keeps the 42ch sinusoidal positional encoding of rasterized FLAME vertex
# positions and DROPS the 3ch per-vertex expression deformation map
# entirely — no substitute channel is added. The UNet's ConditioningEncoder
# drops from 45 input channels to 42. Identity information still reaches
# the model via the frozen reference UNet (K/V feature injection into every
# self-attention block), so the conditioning tensor doesn't need to carry
# identity.

base: loki/configs/base.yaml

output_dir: outputs/condition_ablation/no_deform

model:
  params:
    unet_config:
      params:
        condition_channels: 42

    cond_stage_config:
      target: experiments.condition_ablation.no_deform.conditioning.PosEncOnlyConditioning
      params:
        image_size: 512
        positional_channels: 42
        positional_multiplier: 1.0
