# Ablate audio — no audio.
#
# Same Marigold-generated deformation (4ch) + uniform loss, but audio
# cross-attention is disabled end-to-end. Tests whether the spatial deformation
# signal alone captures enough lip/jaw dynamics, or whether explicit audio
# conditioning is needed for accurate lip sync.

base: marionette/configs/base.yaml

overlays:
  - marionette/configs/overlays/conditioning/deform_only.yaml
  - marionette/configs/overlays/expr_source/marigold.yaml
  - marionette/configs/overlays/audio/off.yaml
