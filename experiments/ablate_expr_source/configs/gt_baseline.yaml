# Ablate expression-map source — GT baseline.
#
# Deform-only conditioning (3ch deformation + 1ch ref_mask = 4ch total) with
# uniform diffusion loss. The 3ch deformation is rasterized from the FLAME
# fit on the fly. This is the fair comparison for the Marigold variant, which
# only produces 3ch deformation and therefore cannot use the 42ch positional
# encoding of vertex positions.

base: marionette/configs/base.yaml

overlays:
  - marionette/configs/overlays/conditioning/deform_only.yaml
  # uniform loss is already the default in base.yaml (alpha=0), no overlay needed.