# Ablate expression-map source — Marigold + 6DRepNet head pose.
#
# Same as the marigold variant (4ch Marigold-generated deformation) but with
# an additional head pose signal extracted from the driver's face frames using
# 6DRepNet. The pose embedding (yaw/pitch/roll → sinusoidal → MLP → 1280-dim)
# is added to the UNet's timestep embedding, providing per-frame head
# orientation that the pose-invariant deformation map cannot carry.
#
# This tests whether explicit pose information closes the gap between
# Marigold conditioning and full FLAME conditioning (which implicitly encodes
# pose in the 42ch positional encoding of vertex positions).

base: marionette/configs/base.yaml

overlays:
  - marionette/configs/overlays/conditioning/deform_only.yaml
  - marionette/configs/overlays/expr_source/marigold.yaml
  - marionette/configs/overlays/pose/on.yaml
