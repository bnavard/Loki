# Conda env for the SadTalker baseline.
#
# IMPORTANT — this deviates from SadTalker's upstream README on purpose.
# Upstream pins torch==1.12.1+cu113 (CUDA 11.3), which does not run on
# modern Hopper/Ada cards (sm_89/sm_90). The pin set below is what Pouyan
# verified working locally with H200 (sm_90): torch 2.1.0+cu121 + matching
# numpy/numba/llvmlite bumps. See `requirements.txt` in this folder for the
# rest of the pins — do NOT install `impl/requirements.txt`, upstream's
# versions conflict with this torch stack.
#
# Create / activate:
#   conda env create -f experiments/sota_comparison/sadtalker/env.yml
#   conda activate sadtalker
#   pip install -r experiments/sota_comparison/sadtalker/requirements.txt
#   bash experiments/sota_comparison/sadtalker/impl/scripts/download_models.sh

name: sadtalker
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - ffmpeg
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.1.0+cu121
      - torchvision==0.16.0+cu121
      - torchaudio==2.1.0+cu121
