# Conda env for the HunyuanPortrait baseline.
#
# Same torch 2.1.0+cu121 stack used for the SadTalker env — verified on
# modern Hopper/Ada cards (sm_89+). HunyuanPortrait's README says
# "pip3 install torch torchvision torchaudio" with no pin; we fix the stack
# here so results are reproducible and don't drift when pip's solver picks
# a different wheel at a later date.
#
# Create / activate:
#   conda env create -f experiments/sota_comparison/hunyuan_portrait/env.yml
#   conda activate hunyuan_portrait
#   pip install -r experiments/sota_comparison/hunyuan_portrait/requirements.txt
#   # then follow README step 3 for HuggingFace weight downloads.

name: hunyuan_portrait
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - ffmpeg
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.1.0+cu121
      - torchvision==0.16.0+cu121
      - torchaudio==2.1.0+cu121
