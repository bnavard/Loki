# Conda env for the EchoMimic baseline.
#
# Upstream README is permissive on torch (>=2.0.1, <=2.2.2) and tested on
# Python 3.8 / 3.10 / 3.11. We pick `python=3.10 + torch 2.1.0+cu121` —
# same stack used by SadTalker and HunyuanPortrait — so most of the
# audio-driven baselines share a torch ABI and we hit the upstream tested
# range squarely.
#
# Create / activate:
#   conda env create -f experiments/sota_comparison/echomimic/env.yml
#   conda activate echomimic
#   pip install -r experiments/sota_comparison/echomimic/requirements.txt

name: echomimic
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - ffmpeg
  # PyAV (`av`) is installed via conda-forge instead of pip: the pip wheel
  # matrix doesn't always cover our py310/manylinux combo, and pip's source
  # build needs ffmpeg dev headers + pkg-config wired to the conda ffmpeg,
  # which is fragile. The conda-forge `av` package is already linked
  # against the conda ffmpeg above — no source build, no pkg-config wiring.
  - av=11.0.0
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.1.0+cu121
      - torchvision==0.16.0+cu121
      - torchaudio==2.1.0+cu121
