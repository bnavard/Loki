# Conda env for the X-Portrait baseline.
#
# X-Portrait's upstream README pins Python 3.9 + CUDA 11.8. Their requirements
# also force torch 2.0.x via xformers>=0.0.22 + triton==2.0.0, so we can't
# reuse the SadTalker / HunyuanPortrait torch 2.1+cu121 stack here.
#
# torch 2.0.1+cu118 still runs on Hopper/Ada via PTX fallback (slightly slower
# kernels than native cu121 but correct). If you're on an older Ampere card,
# it runs natively.
#
# Create / activate:
#   conda env create -f experiments/sota_comparison/xportrait/env.yml
#   conda activate xportrait
#   pip install -r experiments/sota_comparison/xportrait/requirements.txt

name: xportrait
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - ffmpeg
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1+cu118
      - torchvision==0.15.2+cu118
      - torchaudio==2.0.2+cu118
