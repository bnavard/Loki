# Conda env for the AniTalker baseline.
#
# AniTalker's upstream README pins `Python 3.9 + torch 1.8.0 + CUDA 11.1`.
# torch 1.8 was built before Ampere (sm_80+) was GA and does NOT run on
# modern Hopper/Ada cards — the kernels segfault or report "no kernel image
# available for execution on the device" on sm_89+.
#
# We bump to `torch 2.0.1+cu118` (same stack used by the X-Portrait env)
# — old enough to be close to AniTalker's era but modern enough to run on
# H100/H200 with PTX fallback. Documented tradeoff.
#
# Create / activate:
#   conda env create -f experiments/sota_comparison/anitalker/env.yml
#   conda activate anitalker
#   pip install -r experiments/sota_comparison/anitalker/requirements.txt

name: anitalker
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - ffmpeg
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1+cu118
      - torchvision==0.15.2+cu118
      - torchaudio==2.0.2+cu118
