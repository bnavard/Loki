# Marionette evaluation — single config used by `run_inference.py` for both
# protocols (same_identity_reconstruction and cross_identity).
#
# Inherits the model + dataset paths from `marionette/configs/base.yaml`
# (so `val_dataset.params.flame_root` and friends come from there). The CLI
# selects the protocol; this config holds the model architecture knobs that
# can't go on argparse.
#
# `checkpoint` must be populated before running — either here or via
# `--checkpoint <path>` on the CLI.

base: marionette/configs/base.yaml

# Default output root. The runner appends `<protocol>/run_<ts>/` so all
# SOTA wrappers and this one share the
# `outputs/<experiment>/.../<protocol>/run_<ts>/` pattern.
output_dir: outputs/marionette_eval
checkpoint: outputs/marionette_baseline/run_20260421_035445/checkpoints/th-step=030000.ckpt

seed: 42

# Per-dataset FLAME tracking root. The runner picks the entry matching
# `--dataset`. Keeps TalkVid's tracking under `data/flame_tracking/` and
# HDTF's under its own `data/benchmark/hdtf/flame_tracking/` so the two
# pools don't bleed into each other.
flame_roots:
  talkvid: data/flame_tracking/flowface
  hdtf:    data/benchmark/hdtf/flame_tracking/flowface

inference:
  n_frames:     16     # must match UNet `time_steps` set at training time
  cfg_scale:    2.0
  n_ddim_steps: 50
