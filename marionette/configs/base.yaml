# =============================================================================
# Marionette — Base Config
#
# Same-identity self-supervised training:
#   spatial conditioning    : 49 channels
#     [0:42]  pos_enc         42ch sinusoidal encoding of FLAME vertex positions
#     [42:45] driver_deform   3ch per-vertex expression offsets
#     [45:48] warped_ref      3ch backward-warped reference image (grid_sample)
#     [48]    ref_mask        1ch reference-slot indicator
#   audio                   : wav2vec2 cross-attention ON
#   video length            : 16 frames per sample (1 ref + 15 targets)
#
# `output_dir` is intentionally unset here; experiment runners populate it.
# =============================================================================

seed: 42

learning_rate:      1.0e-4
gpu_batch_size:     1
virtual_batch_size: 1
logger_freq:        50
n_steps:            5000
save_every_n_steps: 250

# SD 2.1 checkpoint used to initialise the UNet + VAE weights.
init_path: "data/models/v2-1_512-ema-pruned.ckpt"

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
train_dataset:
  target: marionette.data.video_dataset.TalkingHeadDataset
  params:
    clip_list_path:       "data/derived/train_clips.json"
    video_root:           "data/talkvid/talkvid"
    audio_root:           "data/talkvid/audio"
    flame_root:           "data/flame_tracking/flowface"
    n_frames:             16
    resolution:           512
    downsample_ratio:     8
    fps:                  25.0
    audio_context_frames: 2
    add_mouth:            true

val_dataset:
  target: marionette.data.video_dataset.TalkingHeadDataset
  params:
    clip_list_path:       "data/derived/val_clips.json"
    video_root:           "data/talkvid/talkvid"
    audio_root:           "data/talkvid/audio"
    flame_root:           "data/flame_tracking/flowface"
    n_frames:             16
    resolution:           512
    downsample_ratio:     8
    fps:                  25.0
    audio_context_frames: 2
    add_mouth:            true

# Validation & visualization
val_every_n_steps: 1
n_val_batches:     20
n_vis_samples:     8
vis_ddim_steps:    20

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  target: marionette.model.diffusion.MarionetteDiffusion
  params:
    # Inputs
    first_stage_key: "target_video"
    control_key:     "hint"
    audio_key:       "audio"

    # Video length
    n_frames: 16

    # Guidance (classifier-free dropout probability)
    cfg_probability: 0.1

    # Noise schedule
    linear_start:        0.00085
    linear_end:          0.0120
    timesteps:           1000
    zero_snr_shift:      true
    shift_schedule_flag: true
    sqrt_shift:          true
    minus_one_shift:     true

    # LDM base settings
    num_timesteps_cond:   1
    log_every_t:          200
    image_size:           64      # latent spatial size (512 / 8)
    channels:             4
    cond_stage_trainable: false
    conditioning_key:     crossattn
    monitor:              val/loss_simple_ema
    scale_factor:         0.18215
    use_ema:              false
    only_mid_control:     false
    parameterization:     eps

    # ---- Audio encoder ----
    audio_encoder_config:
      target: marionette.model.audio_encoder.AudioEncoder
      params:
        model_name:      "facebook/wav2vec2-base-960h"
        context_dim:     1024
        freeze_backbone: true
        use_pretrained:  true

    # ---- UNet ----
    unet_config:
      target: marionette.model.unet.MarionetteUNet
      params:
        image_size:                64     # unused, required by parent
        time_steps:                16     # must match model.params.n_frames
        temporal_mode:             "3d"   # or "temporal"
        in_channels:               4
        out_channels:              4
        model_channels:            320
        condition_channels:        49     # 42 pos + 3 deform + 3 warp + 1 ref_mask
        context_dim:               1024   # matches SD 2.1 checkpoint
        attention_resolutions:     [4, 2, 1]
        num_res_blocks:            2
        channel_mult:              [1, 2, 4, 4]
        num_head_channels:         64
        use_spatial_transformer:   true
        use_linear_in_transformer: true
        transformer_depth:         1
        use_checkpoint:            false
        legacy:                    false
        use_audio_context:         true
        # ConditioningEncoder (conv stack 512 → 64) must match
        # cond_stage_config.params.image_size (input) and the UNet's latent
        # spatial size (output). stage_channels must halve resolution per entry.
        cond_input_resolution:     512
        cond_latent_resolution:    64
        cond_stage_channels:       [64, 128, 256, 320]   # 512 → 256 → 128 → 64

    # ---- VAE (frozen) ----
    first_stage_config:
      target: ldm_base.ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor:   val/rec_loss
        ddconfig:
          double_z:         true
          z_channels:       4
          resolution:       512
          in_channels:      3
          out_ch:           3
          ch:               128
          ch_mult:          [1, 2, 4, 4]
          num_res_blocks:   2
          attn_resolutions: []
          dropout:          0.0
        lossconfig:
          target: torch.nn.Identity

    # ---- Conditioning module ----
    cond_stage_config:
      target: marionette.conditioning.conditioning.SpatialConditioning
      params:
        image_size:            512     # emit conditioning at full image res
        positional_channels:   42
        positional_multiplier: 1.0

# ---------------------------------------------------------------------------
# Inference defaults (used by generate.py + VisualizationCallback)
# ---------------------------------------------------------------------------
inference:
  n_frames:  16     # sampler window size V; generate.py reads this
  cfg_scale: 2.0    # classifier-free guidance scale; VisualizationCallback reads this
