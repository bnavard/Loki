# =============================================================================
# Marionette — Base Config
#
# Default values for every field. Experiments compose this with overlays under
# `marionette/configs/overlays/` to produce concrete training configurations.
#
# Defaults:
#   conditioning  : 46 channels (42ch pos enc + 3ch expr deform + 1ch ref mask)
#   expr source   : "gt" (FLAME rasterization)
#   loss weighting: uniform (alpha = 0.0) — overlay `overlays/loss/weighted.yaml`
#                   to switch to expression-weighted loss
#   audio         : wav2vec2 cross-attention ON
#   video length  : 16 frames per sample
#
# `output_dir` is intentionally unset here; experiment runners populate it
# (usually to `outputs/<experiment_name>/<variant>/`).
# =============================================================================

seed: 42

learning_rate:      1.0e-4
gpu_batch_size:     4
virtual_batch_size: 4
logger_freq:        50
n_steps:            5000
save_every_n_steps: 250

# SD 2.1 checkpoint used to initialise the UNet + VAE weights.
init_path: "data/models/v2-1_512-ema-pruned.ckpt"

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
train_dataset:
  target: marionette.data.video_dataset.TalkingHeadDataset
  params:
    clip_list_path:       "data/derived/train_clips.json"
    video_root:           "data/talkvid/talkvid"
    audio_root:           "data/talkvid/audio"
    flame_root:           "data/flame_tracking/flowface"
    n_frames:             16
    resolution:           512
    downsample_ratio:     8
    fps:                  25.0
    audio_context_frames: 2
    add_mouth:            true

val_dataset:
  target: marionette.data.video_dataset.TalkingHeadDataset
  params:
    clip_list_path:       "data/derived/val_clips.json"
    video_root:           "data/talkvid/talkvid"
    audio_root:           "data/talkvid/audio"
    flame_root:           "data/flame_tracking/flowface"
    n_frames:             16
    resolution:           512
    downsample_ratio:     8
    fps:                  25.0
    audio_context_frames: 2
    add_mouth:            true
    # Cross-identity evaluation: each val sample takes its driver signal
    # (expression map / deformation / driving video) AND its audio from a
    # DIFFERENT clip, preventing the model from trivially reproducing signals
    # extracted from the target itself. Pairings are seeded and exclude
    # same-identity drivers where the val set permits.
    cross_identity_driving: true
    pairing_seed:           42

# Validation & visualization
val_every_n_steps: 250
n_val_batches:     20        # number of val batches per evaluation
n_vis_samples:     8         # samples to visualize per evaluation (rotates through val set)
vis_ddim_steps:    20        # DDIM steps for visualization (fewer = faster)

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  target: marionette.model.th_diffusion.THDiffusion
  params:
    # Inputs
    first_stage_key: "jpg"
    control_key:     "hint"
    audio_key:       "audio"

    # Video length
    n_frames: 16

    # Guidance (classifier-free dropout probability)
    cfg_probability: 0.1

    # Loss weighting (default: uniform — all pixels weighted equally)
    expr_weight_alpha: 0.0

    # Noise schedule
    linear_start:        0.00085
    linear_end:          0.0120
    timesteps:           1000
    zero_snr_shift:      true
    shift_schedule_flag: true
    sqrt_shift:          true
    minus_one_shift:     true

    # LDM base settings
    num_timesteps_cond:   1
    log_every_t:          200
    image_size:           64      # latent spatial size (512 / 8)
    channels:             4
    cond_stage_trainable: false
    conditioning_key:     crossattn
    monitor:              val/loss_simple_ema
    scale_factor:         0.18215
    use_ema:              false
    only_mid_control:     false
    parameterization:     eps

    # ---- Audio encoder ----
    audio_encoder_config:
      target: marionette.model.audio_encoder.AudioEncoder
      params:
        model_name:      "facebook/wav2vec2-base-960h"
        context_dim:     1024
        freeze_backbone: true
        use_pretrained:  true

    # ---- UNet ----
    unet_config:
      target: marionette.model.th_unet.THUnetModel
      params:
        image_size:                64     # unused, required by parent
        time_steps:                16     # must match model.params.n_frames
        temporal_mode:             "3d"   # or "temporal"
        in_channels:               4
        out_channels:              4
        model_channels:            320
        condition_channels:        46     # 42 pos + 3 expr + 1 ref_mask
        context_dim:               1024   # matches SD 2.1 checkpoint
        attention_resolutions:     [4, 2, 1]
        num_res_blocks:            2
        channel_mult:              [1, 2, 4, 4]
        num_head_channels:         64
        use_spatial_transformer:   true
        use_linear_in_transformer: true
        transformer_depth:         1
        use_checkpoint:            false
        legacy:                    false
        use_audio_context:         true

    # ---- VAE (frozen) ----
    first_stage_config:
      target: ldm_base.ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor:   val/rec_loss
        ddconfig:
          double_z:         true
          z_channels:       4
          resolution:       512
          in_channels:      3
          out_ch:           3
          ch:               128
          ch_mult:          [1, 2, 4, 4]
          num_res_blocks:   2
          attn_resolutions: []
          dropout:          0.0
        lossconfig:
          target: torch.nn.Identity

    # ---- Conditioning module ----
    cond_stage_config:
      target: marionette.conditioning.th_conditioning.THConditioning
      params:
        image_size:            64
        positional_channels:   42
        positional_multiplier: 1.0
        super_resolution:      8
        use_expr_deformation:  true
        expression_source:     "gt"    # "gt" | "marigold"

# ---------------------------------------------------------------------------
# Inference defaults (used by generate.py / THSampler)
# ---------------------------------------------------------------------------
inference:
  n_ddim_steps: 50
  cfg_scale:    2.0
  eta:          0.0
  n_frames:     16
  seed:         42