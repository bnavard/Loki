# =============================================================================
# Expression Deformation Only + Weighted Loss
#
# UNet conditioning:  4 channels (3ch deformation + 1ch ref mask)
# Loss weighting:     Expression-weighted (alpha=5.0)
# Audio:              wav2vec2 cross-attention
# Reference frame:    Identity passthrough via z_input
#
# The full conditioning uses 46 channels: 42ch encode WHERE the face is (vertex
# positions via positional encoding) and 3ch encode HOW the face is moving
# (per-vertex displacement from neutral — the "deformation"). This config drops
# the 42ch positional encoding and keeps only the 3ch deformation map, which is
# a rasterized heatmap showing the magnitude and direction of facial movement
# at each pixel (e.g. lips opening, jaw dropping, brow raising). The UNet sees
# motion without explicit face geometry.
# =============================================================================

output_dir: "outputs/deform_only_weighted_loss"
seed: 42

learning_rate:     1.0e-4
gpu_batch_size:    4
virtual_batch_size: 4
logger_freq:       50
n_steps:           200000
save_every_n_steps: 250

# Path to SD 2.1 checkpoint for initialising the UNet and VAE weights
init_path: "data/models/v2-1_512-ema-pruned.ckpt"

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
train_dataset:
  target: marionette.data.video_dataset.TalkingHeadDataset
  params:
    id_list_path: "marionette/data/train_ids.txt"
    video_root:   "data/talkvid/talkvid"
    audio_root:   "data/talkvid/audio"
    flame_root:   "data/flowface"
    n_frames: 16
    resolution: 512
    downsample_ratio: 8
    fps: 25.0
    audio_context_frames: 2
    add_mouth: true

val_dataset:
  target: marionette.data.video_dataset.TalkingHeadDataset
  params:
    id_list_path: "marionette/data/val_ids.txt"
    video_root:   "/data/pouyan/talkvid/preprocessed/talkvid"
    audio_root:   "/data/pouyan/talkvid/preprocessed/audio"
    flame_root:   "/data/pouyan/flame_expression/flowface"
    n_frames: 16
    resolution: 512
    downsample_ratio: 8
    fps: 25.0
    audio_context_frames: 2
    add_mouth: true

# Validation & visualization
val_every_n_steps:    250
n_val_batches:        20      # number of val batches per evaluation
n_vis_samples:        8       # number of samples to visualize per evaluation (rotates through val set)
vis_ddim_steps:       20      # DDIM steps for visualization (fewer = faster)

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  target: marionette.model.th_diffusion.THDiffusion
  params:
    # Inputs
    first_stage_key:  "jpg"
    control_key:      "hint"
    audio_key:        "audio"

    # Video length
    n_frames:         16

    # Guidance
    cfg_probability:  0.1

    # Loss weighting
    expr_weight_alpha: 5.0    # amplify loss on high-deformation regions (0 = uniform)

    # Noise schedule
    linear_start:     0.00085
    linear_end:       0.0120
    timesteps:        1000
    zero_snr_shift:   true
    shift_schedule_flag: true
    sqrt_shift:       true
    minus_one_shift:  true

    # LDM base settings
    num_timesteps_cond: 1
    log_every_t:      200
    image_size:       64          # latent spatial size (512 / 8)
    channels:         4
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor:          val/loss_simple_ema
    scale_factor:     0.18215
    use_ema:          false
    only_mid_control: false
    parameterization: eps

    # ---- Audio encoder ----
    audio_encoder_config:
      target: marionette.model.audio_encoder.AudioEncoder
      params:
        model_name:      "facebook/wav2vec2-base-960h"
        context_dim:     1024
        freeze_backbone: true
        use_pretrained:  true

    # ---- UNet ----
    unet_config:
      target: marionette.model.th_unet.THUnetModel
      params:
        image_size:           64      # unused, required by parent
        time_steps:           16      # must match n_frames
        temporal_mode:        "3d"    # or "temporal"
        in_channels:          4
        out_channels:         4
        model_channels:       320
        condition_channels:   4       # 3 expr deform + 1 ref_mask (no pos enc)
        context_dim:          1024    # matches SD 2.1 checkpoint
        attention_resolutions: [4, 2, 1]
        num_res_blocks:       2
        channel_mult:         [1, 2, 4, 4]
        num_head_channels:    64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth:    1
        use_checkpoint:       false
        legacy:               false

    # ---- VAE (frozen) ----
    first_stage_config:
      target: ldm_base.ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 512
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    # ---- Conditioning module ----
    cond_stage_config:
      target: marionette.conditioning.th_conditioning.THConditioning
      params:
        image_size:           64
        positional_channels:  42
        positional_multiplier: 1.0
        super_resolution:     2
        use_expr_deformation: true
        # expression_source: "gt" uses FLAME rasterization (requires verts_2d / offsets_3d from the dataset).
        # Set to "marigold" to consume pre-generated deformation maps from caching/scripts/cache_marigold_deform.py.
        expression_source:    "gt"
        expr_deform_only:    true

# ---------------------------------------------------------------------------
# Inference defaults (used by generate.py / THSampler)
# ---------------------------------------------------------------------------
inference:
  n_ddim_steps:  50
  cfg_scale:     2.0
  eta:           0.0
  n_frames:      16      # total frames including reference
  seed:          42
