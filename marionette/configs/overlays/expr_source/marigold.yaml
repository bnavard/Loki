# Expression-map source variant: use Marigold-generated deformations.
#
# Switches the dataset and conditioning module from on-the-fly FLAME
# rasterization ("gt") to pre-generated Marigold deformation videos, decoded
# per-window from data/derived/marigold_deform/{clip_id}/deformation.mp4.
#
# Prerequisite: run scripts/cache/cache_marigold_deform.py to populate the
# deformation cache before training.
#
# Because the Marigold module only produces the 3ch deformation (not the 42ch
# positional encoding), the UNet conditioning is always 4ch in this mode.
# Combine with `overlays/conditioning/deform_only.yaml` so the UNet layer
# dimensions match (condition_channels=4).
train_dataset:
  params:
    expression_source:    "marigold"
    marigold_deform_root: "data/derived/marigold_deform"

val_dataset:
  params:
    expression_source:    "marigold"
    marigold_deform_root: "data/derived/marigold_deform"

model:
  params:
    cond_stage_config:
      params:
        expression_source: "marigold"