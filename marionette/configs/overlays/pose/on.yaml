# Pose variant: enable 6DRepNet head pose embedding.
#
# Extracts (yaw, pitch, roll) from the driver's face frames using a frozen
# 6DRepNet backbone, encodes them via sinusoidal embedding + learned MLP, and
# adds the result to the UNet's timestep embedding. This provides per-frame
# head orientation information that the deformation map alone cannot carry
# (deformation is pose-invariant by design).
#
# Use with Marigold or driving_video expression sources where FLAME positional
# encoding (which implicitly encodes pose) is not available.
model:
  params:
    pose_encoder_config:
      target: marionette.model.pose_encoder.PoseEncoder
      params:
        embed_dim: 1280        # model_channels * 4 = 320 * 4
        freeze_backbone: true
