# =============================================================================
# No FLAME Conditioning + Uniform Loss
#
# UNet conditioning:  1 channel (ref mask only — no face geometry or deformation)
# Loss weighting:     Uniform (alpha=0.0, all pixels weighted equally)
# Audio:              wav2vec2 cross-attention
# Reference frame:    Identity passthrough via z_input
#
# Removes ALL FLAME-derived spatial conditioning (both the 42ch positional
# encoding of vertex positions AND the 3ch expression deformation). The model
# must rely entirely on audio cross-attention and the reference frame for
# generating face dynamics. Isolates the contribution of FLAME conditioning.
# =============================================================================

output_dir: "outputs/no_expr_uniform_loss"
seed: 42

learning_rate:     1.0e-4
gpu_batch_size:    1
virtual_batch_size: 4
logger_freq:       50
n_steps:           5000
save_every_n_steps: 250

init_path: "data/models/v2-1_512-ema-pruned.ckpt"

# ---------------------------------------------------------------------------
# Dataset (identical to full model)
# ---------------------------------------------------------------------------
train_dataset:
  target: marionette.data.video_dataset.TalkingHeadDataset
  params:
    id_list_path: "marionette/data/train_ids.txt"
    video_root:   "data/talkvid/talkvid"
    audio_root:   "data/talkvid/audio"
    flame_root:   "data/flowface"
    n_frames: 84
    resolution: 512
    downsample_ratio: 8
    fps: 25.0
    audio_context_frames: 2
    add_mouth: true

val_dataset:
  target: marionette.data.video_dataset.TalkingHeadDataset
  params:
    id_list_path: "marionette/data/val_ids.txt"
    video_root:   "/data/pouyan/talkvid/preprocessed/talkvid"
    audio_root:   "/data/pouyan/talkvid/preprocessed/audio"
    flame_root:   "/data/pouyan/flame_expression/flowface"
    n_frames: 84
    resolution: 512
    downsample_ratio: 8
    fps: 25.0
    audio_context_frames: 2
    add_mouth: true

# Validation & visualization
val_every_n_steps:    250
n_val_batches:        20
n_vis_samples:        8
vis_ddim_steps:       20

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  target: marionette.model.th_diffusion.THDiffusion
  params:
    first_stage_key:  "jpg"
    control_key:      "hint"
    audio_key:        "audio"

    n_frames:         84
    cfg_probability:  0.1

    # Loss weighting (expr_weight_alpha=0 since no expression maps in this ablation)
    expr_weight_alpha: 0.0

    # Noise schedule
    linear_start:     0.00085
    linear_end:       0.0120
    timesteps:        1000
    zero_snr_shift:   true
    shift_schedule_flag: true
    sqrt_shift:       true
    minus_one_shift:  true

    # LDM base settings
    num_timesteps_cond: 1
    log_every_t:      200
    image_size:       64
    channels:         4
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor:          val/loss_simple_ema
    scale_factor:     0.18215
    use_ema:          false
    only_mid_control: false
    parameterization: eps

    # ---- Audio encoder (unchanged) ----
    audio_encoder_config:
      target: marionette.model.audio_encoder.AudioEncoder
      params:
        model_name:      "facebook/wav2vec2-base-960h"
        context_dim:     1024
        freeze_backbone: true
        use_pretrained:  true

    # ---- UNet ----
    unet_config:
      target: marionette.model.th_unet.THUnetModel
      params:
        image_size:           64
        time_steps:           84
        temporal_mode:        "3d"
        in_channels:          4
        out_channels:         4
        model_channels:       320
        condition_channels:   1       # only ref_mask (was 46)
        context_dim:          1024
        attention_resolutions: [4, 2, 1]
        num_res_blocks:       2
        channel_mult:         [1, 2, 4, 4]
        num_head_channels:    64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth:    1
        use_checkpoint:       false
        legacy:               false

    # ---- VAE (frozen, identical) ----
    first_stage_config:
      target: ldm_base.ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 512
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    # ---- Conditioning module ----
    cond_stage_config:
      target: marionette.conditioning.th_conditioning.THConditioning
      params:
        image_size:           64
        positional_channels:  42
        positional_multiplier: 1.0
        super_resolution:     2
        use_expr_deformation: true
        # expression_source: "gt" uses FLAME rasterization (requires verts_2d / offsets_3d from the dataset).
        # Set to "marigold" to consume pre-generated deformation maps from scripts/cache/cache_marigold_deform.py.
        expression_source:    "gt"
        drop_expression_map:  true    # removes all FLAME spatial conditioning

# ---------------------------------------------------------------------------
# Inference defaults
# ---------------------------------------------------------------------------
inference:
  n_ddim_steps:  50
  cfg_scale:     2.0
  eta:           0.0
  n_frames:      84
  seed:          42
